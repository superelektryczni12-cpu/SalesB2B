name: Build macOS installer

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build macOS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac || (echo "Retrying after hdiutil flakiness..." && npm run build:mac)

      - name: Publish installer to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view macos-installer >/dev/null 2>&1; then
            gh release upload macos-installer dist/*.dmg --clobber
          else
            gh release create macos-installer dist/*.dmg --title "Sales B2B — macOS" --notes "Najnowszy automatyczny build macOS. Ten sam link zawsze wskazuje na najnowszą wersję."
          fi
